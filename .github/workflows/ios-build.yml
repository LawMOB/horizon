name: iOS build

on:
  push:
    branches:
      - ios-port
    paths-ignore:
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Build
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: cargo build --locked --profile ios --target aarch64-apple-ios -p horizon-game --bin horizon-client --no-default-features --features audio
      - name: Package
        run: bash packaging/ios/package.sh target/aarch64-apple-ios/ios/horizon-client "$(sed -n 's/^version = "\(.*\)"/\1/p' crates/horizon-client/Cargo.toml | head -1)" dist
      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-ios
          path: dist/Horizon.ipa
          if-no-files-found: error
